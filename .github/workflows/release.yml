name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" \
            -o dist/blackarch-rankmirrors-linux-amd64 \
            ./cmd/barch-rankmirrors
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" \
            -o dist/blackarch-rankmirrors-linux-arm64 \
            ./cmd/barch-rankmirrors

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true